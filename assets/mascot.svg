<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield / Crest Background -->
  <path d="M 50,4 C 76,4 92,16 92,38 C 92,68 50,96 50,96 C 50,96 8,68 8,38 C 8,16 24,4 50,4 Z" 
        fill="url(#crestGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Robot Mascot Head -->
  <rect x="28" y="34" width="44" height="34" rx="10" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.8" />
  
  <!-- Robot Antenna -->
  <line x1="50" y1="34" x2="50" y2="24" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="22" r="4.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Robot Ears -->
  <rect x="23" y="44" width="5" height="14" rx="2" fill="url(#goldGrad)" />
  <rect x="72" y="44" width="5" height="14" rx="2" fill="url(#goldGrad)" />

  <!-- Robot Eyes (Friendly Glowing Cyan) -->
  <circle cx="41" cy="48" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="42.5" cy="46.5" r="1.5" fill="#ffffff" />
  <circle cx="59" cy="48" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="60.5" cy="46.5" r="1.5" fill="#ffffff" />

  <!-- Robot Smile -->
  <path d="M 43,58 Q 50,64 57,58" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Graduation Cap perched on Robot Head -->
  <path d="M 50,15 L 75,25 L 50,33 L 25,25 Z" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="1.5" />
  <polygon points="50,16 73,25 50,32 27,25" fill="#312e81" opacity="0.8" />
  <!-- Cap Tassel -->
  <path d="M 68,27 C 72,30 73,36 74,40" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="74" cy="41" r="2" fill="#eab308" />

  <!-- Academic Star at bottom -->
  <path d="M 50,74 L 52,79 L 57,80 L 53,83 L 54,88 L 50,85 L 46,88 L 47,83 L 43,80 L 48,79 Z" fill="url(#goldGrad)" />
</svg>
